name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v

      - name: Verify CLI pipeline execution
        env:
          PYTHONPATH: src
        run: |
          mkdir -p data/processed
          python -m bird_strike_weather.cli init-db --db data/processed/ci_test.sqlite
          python -m bird_strike_weather.cli load-airports --db data/processed/ci_test.sqlite --csv data/raw/sample_airports.csv
          python -m bird_strike_weather.cli load-strikes-csv --db data/processed/ci_test.sqlite --csv data/raw/sample_wildlife_strikes.csv
          python -m bird_strike_weather.cli load-weather-csv --db data/processed/ci_test.sqlite --csv data/raw/sample_weather_daily.csv
          python -m bird_strike_weather.cli dq --db data/processed/ci_test.sqlite
          python -m bird_strike_weather.cli summary --db data/processed/ci_test.sqlite
          python -m bird_strike_weather.cli export-mart --db data/processed/ci_test.sqlite --output data/processed/ci_mart.csv
